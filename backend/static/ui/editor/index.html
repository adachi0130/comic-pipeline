<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫画页编辑器</title>
<link rel="stylesheet" href="./editor.css">
<style>html,body{height:100%;margin:0;overflow:hidden}</style>
</head>
<body>
<div id="editor-host" class="comic-editor"></div>
<script type="module">
import { createComicEditor } from './comicEditor.mjs';

const params = new URLSearchParams(location.search);
const projectId = Number(params.get('p') || 0);
const pageRef = params.get('page') || '';
const embedded = params.get('embedded') === '1' && window.parent !== window;
const session = params.get('session') || '';
const host = document.getElementById('editor-host');

const notify = (event, extra = {}) => {
  if (!embedded) return;
  window.parent.postMessage({
    type: 'comic-editor:state', event, projectId, pageRef, session, ...extra,
  }, location.origin);
};

async function api(path, { method = 'GET', body } = {}) {
  const response = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  let payload = null;
  try { payload = text ? JSON.parse(text) : null; } catch { payload = null; }
  if (!response.ok) {
    const detail = payload?.detail || text || `请求失败（${response.status}）`;
    // 409（保存冲突）等结构化错误要带上状态码与 detail，供上层给出
    // “载入最新 / 覆盖”的选择，而不是只抛一段文案。
    const error = new Error(typeof detail === 'string' ? detail : (detail?.message || JSON.stringify(detail)));
    error.status = response.status;
    error.detail = typeof detail === 'object' && detail ? detail : null;
    throw error;
  }
  return payload;
}

const editor = createComicEditor({
  host,
  api,
  onDirty: (dirty) => notify('dirty', { message: dirty ? '当前漫画页有未保存的修改。' : '' }),
  onNotice: (message, kind) => { if (kind === 'error') notify('error', { message }); },
  onSaved: (payload) => notify('saved', {
    version: payload.version,
    artifactId: payload.artifact_id,
    dirty: editor.isDirty(),
    message: payload.has_preview
      ? `漫画页已保存 v${payload.version}`
      : `画布已保存 v${payload.version}，但整页快照未生成`,
  }),
});

// 父页面通过 postMessage 请求保存（工具栏按钮）。
window.addEventListener('message', (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type !== 'comic-editor:command') return;
  if (event.data.command === 'save') editor.save();
});

// 保存前提示：未保存修改时拦截关闭，避免误丢
window.addEventListener('beforeunload', (event) => {
  if (editor.isDirty()) { event.preventDefault(); event.returnValue = ''; }
});

(async () => {
  if (!projectId || !pageRef) {
    host.innerHTML = '<p style="padding:24px;color:#8b93a1">缺少项目或页参数。请从「分页合成」或「编辑」页进入。</p>';
    notify('error', { message: '缺少项目或页参数' });
    return;
  }
  try {
    await editor.load(projectId, pageRef);
    notify('ready', { message: '漫画页已就绪，可以编辑并保存。' });
    // 独立窗口模式下，允许返回入口
    if (!embedded && params.get('back')) {
      const back = document.createElement('a');
      back.href = params.get('back');
      back.textContent = '← 返回';
      back.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:40;background:#242a33;border:1px solid #2b3038;border-radius:6px;padding:6px 10px;color:#e8eaee;text-decoration:none;font-size:12.5px';
      document.body.appendChild(back);
    }
  } catch (error) {
    notify('error', { message: error.message || '打开漫画页失败' });
  }
})();
</script>
</body>
</html>
