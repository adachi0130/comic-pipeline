<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫画页编辑器</title>
<style>
  :root{
    --bg:#14161a;--panel:#1c1f26;--panel2:#171a20;--line:#2b3038;--ink:#e8eaee;--muted:#8b93a1;
    --accent:#4c8dff;--ok:#3ecf8e;--warn:#ffb454;--err:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  #editor-host{height:100%;min-height:0}
  button{font:inherit;cursor:pointer}
  .sm{background:#242a33;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12.5px}
  .sm:hover:not(:disabled){border-color:var(--accent);color:#fff}
  .sm:disabled{opacity:.45;cursor:not-allowed}
  .sm.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .sm.danger{color:#ffb3b3;border-color:#a33}
  .sm.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 三栏：工具 / 画布 / 侧栏。高度用 100%（不是 100dvh），由 #editor-host 限定，
     否则在某些布局下会把视口撑高导致画布被裁。 */
  .ce-root{display:grid;grid-template-columns:132px minmax(0,1fr) 250px;height:100%;min-height:0}
  .ce-tools{border-right:1px solid var(--line);background:var(--panel);padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
  .ce-tool-group{display:flex;flex-direction:column;gap:4px}
  .ce-tool{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;background:#20242c;border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--ink);font-size:12.5px;text-align:left}
  .ce-tool:hover{border-color:var(--accent)}
  .ce-tool.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .ce-tool-key{font-size:10px;opacity:.65;border:1px solid currentColor;border-radius:4px;padding:0 4px}
  .ce-field{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
  .ce-field input[type=range]{width:100%}
  .ce-field select,.ce-field input[type=number]{background:#0f1115;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-size:12px}

  .ce-center{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
  .ce-topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
  .ce-spacer{flex:1}
  .ce-badge{font-size:11.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .ce-badge.ok{color:var(--ok);border-color:var(--ok)}
  .ce-badge.warn{color:var(--warn);border-color:var(--warn)}
  .ce-badge.err{color:var(--err);border-color:var(--err)}
  .ce-badge.run{color:var(--accent);border-color:var(--accent)}
  .ce-hint{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60ch}

  .ce-viewport{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
    background-color:#0f1115;background-image:radial-gradient(#ffffff10 1px,transparent 1px);background-size:18px 18px;touch-action:none}
  .ce-canvas{max-width:none;max-height:none;transform-origin:center;box-shadow:0 8px 30px #0008;background:#fff;touch-action:none;user-select:none}

  .ce-side{border-left:1px solid var(--line);background:var(--panel);padding:10px;overflow-y:auto;min-height:0}
  .ce-side h3{font-size:12px;margin:12px 0 6px;color:var(--muted);font-weight:600;text-transform:none}
  .ce-side h3:first-child{margin-top:0}
  .ce-tip{font-size:11.5px;color:var(--muted);margin:4px 0 8px;line-height:1.5}
  .ce-layers{display:flex;flex-direction:column;gap:3px}
  .ce-layer{display:flex;align-items:center;gap:2px;background:#20242c;border:1px solid var(--line);border-radius:6px;padding:2px 4px}
  .ce-layer.on{border-color:var(--accent)}
  .ce-layer-name{flex:1;min-width:0;background:none;border:0;color:var(--ink);text-align:left;font-size:12px;padding:3px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ce-icon{background:none;border:0;color:var(--muted);font-size:12px;padding:2px 3px;border-radius:4px}
  .ce-icon:hover{background:#2b3038;color:#fff}
  .ce-list{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .ce-row{display:flex;align-items:center;gap:6px;background:#20242c;border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--ink);font-size:12px;text-align:left;width:100%}
  .ce-row:hover{border-color:var(--accent)}
  .ce-row.on{border-color:var(--accent);background:#232b38}
  .ce-row b{min-width:16px;color:var(--accent)}
  .ce-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11px}
  .ce-row i{font-style:normal;font-size:10.5px;padding:0 5px;border-radius:8px;border:1px solid}
  .ce-row i.ok{color:var(--ok);border-color:var(--ok)}
  .ce-row i.warn{color:var(--warn);border-color:var(--warn)}
  .ce-actions{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .ce-actions .sm{font-size:11.5px;padding:4px 8px}

  /* 弹窗 */
  .ce-modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .ce-modal-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;width:min(460px,100%);max-height:90dvh;overflow:auto}
  .ce-modal-box.wide{width:min(760px,100%)}
  .ce-modal-box h3{margin:0 0 10px;font-size:14px}
  .ce-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:10px 0}
  .ce-modal-grid .wide{grid-column:1/-1}
  .ce-modal-grid textarea{width:100%;background:#0f1115;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;font:inherit;resize:vertical}
  .ce-modal-grid input[type=color]{width:100%;height:28px;background:none;border:1px solid var(--line);border-radius:5px;padding:1px}
  .ce-modal-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
  .ce-crop{width:100%;height:min(52vh,460px);display:block;background:#fafafa;border-radius:6px;touch-action:none;user-select:none}

  @media(max-width:1100px){
    .ce-root{grid-template-columns:112px minmax(0,1fr) 210px}
  }
  @media(max-width:820px){
    .ce-root{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
    .ce-tools{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
    .ce-tool-group{flex-direction:row}
    .ce-tool{width:auto;white-space:nowrap}
    .ce-field{display:none}
    .ce-side{border-left:0;border-top:1px solid var(--line);max-height:34dvh}
  }
</style>
</head>
<body>
<div id="editor-host"></div>
<script type="module">
import { createComicEditor } from './comicEditor.mjs';

const params = new URLSearchParams(location.search);
const projectId = Number(params.get('p') || 0);
const pageRef = params.get('page') || '';
const embedded = params.get('embedded') === '1' && window.parent !== window;
const session = params.get('session') || '';
const host = document.getElementById('editor-host');

const notify = (event, extra = {}) => {
  if (!embedded) return;
  window.parent.postMessage({
    type: 'comic-editor:state', event, projectId, pageRef, session, ...extra,
  }, location.origin);
};

async function api(path, { method = 'GET', body } = {}) {
  const response = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  let payload = null;
  try { payload = text ? JSON.parse(text) : null; } catch { payload = null; }
  if (!response.ok) {
    const detail = payload?.detail || text || `请求失败（${response.status}）`;
    throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
  }
  return payload;
}

const editor = createComicEditor({
  host,
  api,
  onDirty: (dirty) => notify('dirty', { message: dirty ? '当前漫画页有未保存的修改。' : '' }),
  onNotice: (message, kind) => { if (kind === 'error') notify('error', { message }); },
  onSaved: (payload) => notify('saved', {
    version: payload.version,
    artifactId: payload.artifact_id,
    dirty: editor.isDirty(),
    message: payload.has_preview
      ? `漫画页已保存 v${payload.version}`
      : `画布已保存 v${payload.version}，但整页快照未生成`,
  }),
});

// 父页面通过 postMessage 请求保存（工具栏按钮）。
window.addEventListener('message', (event) => {
  if (event.origin !== location.origin) return;
  if (event.data?.type !== 'comic-editor:command') return;
  if (event.data.command === 'save') editor.save();
});

// 保存前提示：未保存修改时拦截关闭，避免误丢
window.addEventListener('beforeunload', (event) => {
  if (editor.isDirty()) { event.preventDefault(); event.returnValue = ''; }
});

(async () => {
  if (!projectId || !pageRef) {
    host.innerHTML = '<p style="padding:24px;color:#8b93a1">缺少项目或页参数。请从「分页合成」或「编辑」页进入。</p>';
    notify('error', { message: '缺少项目或页参数' });
    return;
  }
  try {
    await editor.load(projectId, pageRef);
    notify('ready', { message: '漫画页已就绪，可以编辑并保存。' });
    // 独立窗口模式下，允许返回入口
    if (!embedded && params.get('back')) {
      const back = document.createElement('a');
      back.href = params.get('back');
      back.textContent = '← 返回';
      back.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:40;background:#242a33;border:1px solid #2b3038;border-radius:6px;padding:6px 10px;color:#e8eaee;text-decoration:none;font-size:12.5px';
      document.body.appendChild(back);
    }
  } catch (error) {
    notify('error', { message: error.message || '打开漫画页失败' });
  }
})();
</script>
</body>
</html>
